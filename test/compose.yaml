services:
  identity:
    container_name: identity
    image: fitcr.ksi.in.fit.cvut.cz/k8shell-base/identity:0.8
    command: [ "/app/identity", "--config", "/app/config/config.yaml" ]
    working_dir: /app
    restart: unless-stopped
    ports:
      - "9090:9090"
    environment:
      SECRET_FILES: /app/secrets
      POSTGRES_DATABASE: postgres
      POSTGRES_HOSTNAME: k8shell-db-postgresql
      POSTGRES_PORT: 5432
      MEMCACHED_HOSTNAME: k8shell-cache-memcached
      MEMCACHED_PORT: 11211
    volumes:
      - ./secrets:/app/secrets:ro
      - ../config:/app/config:ro
      - ../db:/app/db:ro

  k8shell-cache-memcached:
    container_name: memcached
    image: bitnami/memcached:1.6.25-debian-12-r0
    restart: unless-stopped
    ports:
      - "11211:11211"

  k8shell-db-postgresql:
    container_name: postgresql
    image: postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
