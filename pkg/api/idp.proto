syntax = "proto3";

package idp;

option go_package = "github.com/k8shell-io/identity/pkg/api/idppb;idppb";

import ".proto_deps/common/pkg/gapi/common.proto";
import "pkg/api/types.proto";

// IdentityProviderService defines the gRPC service for identity provider operations
service IdentityProviderService {
  // ProviderInfo returns metadata about the identity provider, including its name,
  // capabilities, user max age, and address.
  rpc ProviderInfo(ProviderInfoRequest) returns (ProviderInfoResponse);

  // FindUser retrieves a user by username. It can be used for authentication and user lookup.
  rpc FindUser(types.FindUserRequest) returns (common.User);

  // OnboardCapability returns the onboarding capability details for a user.(types.Username) returns (common.UserOnboardCapability);

  // OnboardUserDeviceFlow initiates the device flow onboarding process for a user.
  rpc OnboardUserDeviceFlow(types.Username) returns (common.OnboardUserDeviceFlow);

  // OnboardUserWebFlow initiates the web flow onboarding process for a user.
  rpc OnboardUserWebFlow(types.OnboardUserWebFlowRequest) returns (common.OnboardUserWebFlow);

  // CompleteUserWebFlow completes the web flow onboarding process using the provided state and code.
  rpc CompleteUserWebFlow(types.CompleteUserWebFlowRequest) returns (common.User);

  // AuthUserPublicKey authenticates a user using a public key and returns the authentication result
  rpc AuthUserPublicKey(types.AuthUserPublicKeyRequest) returns (types.AuthUserResponse);

  // GetUserToken retrieves an authentication token for a user.
  rpc GetUserToken(types.Username) returns (UserToken);

  // GetBlueprintByUserStr retrieves a blueprint associated with a user string identifier.
  rpc GetBlueprintByUserStr(types.UserStr) returns (types.Blueprint);

  // ResolvePullRequestToRef resolves a pull request to a repository reference (e.g., branch or commit).
  rpc ResolvePullRequestToRef(types.RepoPullRequestRequest) returns (types.RepoRefResponse);
}

// ProviderInfoRequest is an empty request message used to query provider metadata.
message ProviderInfoRequest {}

// ProviderInfoResponse carries metadata about the identity provider.
message ProviderInfoResponse {
  string          name         = 1;
  repeated string capabilities = 2;
  uint32          user_max_age = 3;
  string          address      = 4;
}

// UserToken holds a provider-issued authentication token for a user.
message UserToken {
  string token = 1;
}
