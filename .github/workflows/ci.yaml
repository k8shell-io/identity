name: CI
# See https://github.com/k8shell-io/internals/tree/main/docs/handbook/docs/development/release_and_testing for information on release and testing processes.

on:
  push:
    paths:
      - "docker/**"
      - "internal/**"
      - "pkg/**"
      - "tests/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".github/workflows/ci.yaml"

  pull_request:
    branches:
      - "*"
    paths:
      - "docker/**"
      - "internal/**"
      - "pkg/**"
      - "tests/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".github/workflows/ci.yaml"

  workflow_dispatch:

env:
  GO_VERSION: "1.24.5"

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  CI:
    runs-on: k8shell-runner
    if: github.event_name == 'push' || github.event.pull_request.draft == false

    env:
      GO111MODULE: on

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Git for private modules
        run: |
          git config --global url."https://${{ secrets.GH_PAT_TOKEN }}:x-oauth-basic@github.com/".insteadOf "https://github.com/"

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build binaries
        run: make build

      - name: Run binary smoke tests (test-self)
        run: make test-self

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-test-reports-go${{ env.GO_VERSION }}
          path: reports/
          retention-days: 30

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: reports/**/*-junit.xml
          check_name: Self-Tests (Go ${{ env.GO_VERSION }})
