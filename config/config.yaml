# Identity service configuration

# http server
grpc:
  port: 9020
  enableTLS: false
  certFile: /opt/shared/identity/tls/tls.crt
  keyFile: /opt/shared/identity/tls/tls.key

  # JWT required claims for authentication
  authEnabled: false
  audience: identity
  allowed:
    - serviceAccount: ssh-proxy
    - serviceAccount: api-server

nats:
  enabled: true
  url: nats://nats.k8shell-test:4222
  username: identity
  password: !file ${SECRET_FILES}/token_identity

# DB configuration
db:
  enabled: true
  username: !file ${SECRET_FILES}/postgres_username
  password: !file ${SECRET_FILES}/postgres_password
  database: ${POSTGRES_DATABASE}
  hostname: ${POSTGRES_HOSTNAME}
  port: !!int ${POSTGRES_PORT}

# identity providers
localProviders:
  enabled: true
  files:
    - users.yaml
  
remoteProviders:
  - address: 10.42.2.211:9030 #idp-usermap.k8shell-test:9030
    tokenFilePath: /opt/shared/auth/identity/idp-token
    #caCertPath: /opt/shared/auth/ca.crt
    #serverName: idp-usermap.k8shell-test.svc  

# JWT token issuance
jwtIssuer:
  issuer: identity.k8shell
  audience: k8shell
  expiry: 1h
  signingMethod: rs256
  privateKeyFile: ${SECRET_FILES}/jwt_private.pem
