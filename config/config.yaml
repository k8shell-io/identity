# Identity service configuration

# http server
grpc:
  port: 9020
  enableTLS: false
  certFile: /opt/shared/identity/tls/tls.crt
  keyFile: /opt/shared/identity/tls/tls.key

  # JWT required claims for authentication
  authEnabled: false
  audience: identity
  allowed:
    - serviceAccount: ssh-proxy
    - serviceAccount: api-server

nats:
  enabled: true
  url: nats://nats.k8shell-test:4222
  username: k8shell-service
  password: !file ${SECRET_FILES}/token_identity_test

# Password brute-force lockout for AuthUserPassword, keyed by username in
# identity's own NATS KV storage. Has no effect when nats.enabled is false.
passwordLockout:
  # maxAttempts is the number of consecutive failed password attempts
  # before an account is locked. Defaults to 5 when unset.
  maxAttempts: 5
  # lockDuration is how long an account stays locked once maxAttempts is
  # reached. Defaults to 15m when unset.
  lockDuration: 15m

# SMTP relay for password-reset email. Disabled by default; when disabled
# (or unreachable), RequestPasswordReset logs and swallows the failure and
# still reports success to callers. To enable against a real relay, set
# enabled: true and point password at a provisioned secret file, e.g.
# password: !file ${SECRET_FILES}/smtp_password
smtp:
  enabled: true
  host: smtp.gmail.com
  port: 587
  username: tomas@vitvar.com
  password: ${SMTP_PASSWORD}
  from: info@k8shell.io

# Password-reset token lifecycle, stored in identity's own NATS KV storage.
# Has no effect when nats.enabled is false.
passwordReset:
  # tokenTTL bounds how long an issued reset link stays valid. Defaults to
  # 1h when unset.
  tokenTTL: 1h
  # cooldownDuration is how long a username must wait between
  # RequestPasswordReset calls before a new one actually sends email.
  # Defaults to 60s when unset.
  cooldownDuration: 60s

# Periodic sender that emails active, email_enabled announcements to users
# who both match the announcement's org/role targeting and have opted in
# (announcementsByEmail, in their own user_settings). Reuses the smtp relay
# above.
announcementEmail:
  # interval is how often the sender checks for eligible announcements and
  # candidates. Defaults to 1m when unset.
  interval: 1m
  # sendHour is the hour of day (0-23, in timezone) at or after which sends
  # are allowed to start on an announcement's activation day (its starts_at,
  # or created_at when starts_at is unset). Defaults to 9 when unset.
  sendHour: 9
  # timezone sendHour and each announcement's activation day are evaluated
  # in (IANA name). Defaults to "UTC" when unset.
  timezone: UTC
  # subjects maps a language (the same value resolved from a candidate's
  # own user_settings "language" key used to pick their translation) to the
  # email subject line used for that language. A language with no entry
  # falls back to subjects.en, then to a fixed generic subject. Defaults to
  # {en, cs} below when unset — add more languages as needed.
  subjects:
    en: New k8shell announcement
    cs: Nové oznámení k8shell

# Caps total outbound email volume (summed across password-reset and
# announcement email — see identity.mail_sends) in a trailing 24h window.
# 0 disables the cap. Set this when smtp above points at a rate-limited
# relay — e.g. a personal Gmail account's undocumented ~500-recipients/24h
# cap; 450 leaves some margin. Raise it (e.g. 2000) for a Google Workspace
# account, or leave at 0 behind a dedicated transactional relay.
mailRateLimit:
  dailyRecipientCap: 450

# DB configuration
db:
  enabled: true
  username: !file ${SECRET_FILES}/postgres_username
  password: !file ${SECRET_FILES}/postgres_password_test
  database: ${POSTGRES_DATABASE}
  hostname: ${POSTGRES_HOSTNAME}
  port: !!int ${POSTGRES_PORT}

# identity providers
localProviders:
  enabled: true
  files:
    - users.yaml
  
remoteProviders:
  - address: bruckins-idp-usermap.k8shell-io:9030 #idp-usermap.k8shell-test:9030
    tokenFilePath: /opt/shared/auth/identity/idp-token
    #caCertPath: /opt/shared/auth/ca.crt
    #serverName: idp-usermap.k8shell-test.svc  
  - address: bruckins-idp-github.k8shell-io:9030 #idp-usermap.k8shell-test:9030
    tokenFilePath: /opt/shared/auth/identity/idp-token
    #caCertPath: /opt/shared/auth/ca.crt
    #serverName: idp-usermap.k8shell-test.svc  
  - address: 10.42.1.73:9031 #idp-gitlab.k8shell-test:9031
    tokenFilePath: /opt/shared/auth/identity/idp-token
    #caCertPath: /opt/shared/auth/ca.crt
    #serverName: idp-gitlab.k8shell-test.svc  

# JWT token issuance for user tokens. 
# These tokens are used for authentication to the API server and SSH proxy.
jwtIssuer:
  issuer: identity.k8shell
  audience: k8shell
  expiry: 10m
  signingMethod: es256
  privateKeyFile: ${SECRET_FILES}/test-jwt-private-key.pem

# onboardRules seeds identity.onboard_rules on startup — each entry is
# inserted once, keyed by (idp, usernamePattern, org); already-existing rows
# (from a prior startup or a later admin edit via the API) are left
# untouched. Without at least a catch-all rule per (idp, org) a fresh
# deployment's onboard_rules table is empty and onboarding fails closed for
# everyone. action is one of: allow, reject, waitlist.
onboardRules:
  - idp: "*"
    usernamePattern: "bruckins"
    org: default
    action: allow
    sudo: true
    roles: ["admin"]
  - idp: "*"
    usernamePattern: "*"
    org: default
    action: waitlist
    priority: 1000

# Kubernetes integration configuration
kubernetes:
  # saToken configures on-demand service-account token issuance via the
  # Kubernetes TokenRequest API.
  saToken:
    # enabled: false to disable GetUserCredential for kubernetes service accounts.
    enabled: true
    # ttl is the requested token lifetime (min 10m, Kubernetes enforced).
    ttl: 1h
    # audiences embedded in issued tokens.
    audiences:
      - https://kubernetes.default.svc.cluster.local

