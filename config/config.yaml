# Identity service configuration

# http server
grpc:
  port: 9020
  enableTLS: false
  certFile: /opt/shared/identity/tls/tls.crt
  keyFile: /opt/shared/identity/tls/tls.key

  # JWT required claims for authentication
  authEnabled: false
  audience: identity
  allowed:
    - serviceAccount: ssh-proxy
    - serviceAccount: api-server

nats:
  enabled: true
  url: nats://nats.k8shell-test:4222
  username: k8shell-service
  password: !file ${SECRET_FILES}/token_identity_test

# DB configuration
db:
  enabled: true
  username: !file ${SECRET_FILES}/postgres_username
  password: !file ${SECRET_FILES}/postgres_password_test
  database: ${POSTGRES_DATABASE}
  hostname: ${POSTGRES_HOSTNAME}
  port: !!int ${POSTGRES_PORT}

# Organization management
organizations:
  # autoCreate lists organizations that are created automatically when a user
  # with that organization is first seen. Use ["*"] to allow all organizations.
  autoCreate:
    - default
    - ctu
    - github
    - gitlab

# identity providers
localProviders:
  enabled: true
  files:
    - users.yaml
  
remoteProviders:
  - address: bruckins-idp-usermap.k8shell-io:9030 #idp-usermap.k8shell-test:9030
    tokenFilePath: /opt/shared/auth/identity/idp-token
    #caCertPath: /opt/shared/auth/ca.crt
    #serverName: idp-usermap.k8shell-test.svc  
  - address: bruckins-idp-github.k8shell-io:9030 #idp-usermap.k8shell-test:9030
    tokenFilePath: /opt/shared/auth/identity/idp-token
    #caCertPath: /opt/shared/auth/ca.crt
    #serverName: idp-usermap.k8shell-test.svc  
  - address: 10.42.1.73:9031 #idp-gitlab.k8shell-test:9031
    tokenFilePath: /opt/shared/auth/identity/idp-token
    #caCertPath: /opt/shared/auth/ca.crt
    #serverName: idp-gitlab.k8shell-test.svc  

# JWT token issuance for user tokens. 
# These tokens are used for authentication to the API server and SSH proxy.
jwtIssuer:
  issuer: identity.k8shell
  audience: k8shell
  expiry: 10m
  signingMethod: es256
  privateKeyFile: ${SECRET_FILES}/test-jwt-private-key.pem

# Kubernetes secret management for user tokens.
# Issued JWTs are written to per-user Secrets named
# "identity-token-<username>" in <namespace>.
# When db is configured, distributed refresh uses SELECT FOR UPDATE SKIP LOCKED.
# When db is disabled (file-provider only), Kubernetes Lease leader election
# ensures only one identity instance runs the refresh loop.
kubernetes:
  namespace: workspaces-test

  # lease configures distributed leader election for the JWT token refresh loop.
  lease:
    name: identity-token-refresh
    refreshInterval: 1m
    refreshLookahead: 2m

  # saToken configures on-demand service-account token issuance via the
  # Kubernetes TokenRequest API.
  saToken:
    # enabled: false to disable GetUserCredential for kubernetes service accounts.
    enabled: true
    # ttl is the requested token lifetime (min 10m, Kubernetes enforced).
    ttl: 1h
    # audiences embedded in issued tokens.
    audiences:
      - https://kubernetes.default.svc.cluster.local

